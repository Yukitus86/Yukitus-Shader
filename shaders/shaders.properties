# ==================================================================================================
#   Yukitus Shader - pack properties (Iris / OptiFine)
# ==================================================================================================

# ---- vanilla features replaced by the shader --------------------------------------------------------
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=false
moon=false
separateAo=true
dynamicHandLight=true
frustum.culling=true
rain.depth=false
beacon.beam.depth=true
particles.ordering=mixed

#ifdef VOLUMETRIC_CLOUDS
clouds=off
#else
clouds=fancy
#endif

# ---- shadows ------------------------------------------------------------------------------------------
shadowTerrain=true
shadowTranslucent=true
#ifdef ENTITY_SHADOWS
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true
#else
shadowEntities=false
shadowBlockEntities=false
shadowPlayer=false
#endif

#ifndef SHADOWS
program.shadow.enabled=false
program.world0/shadow.enabled=false
program.world1/shadow.enabled=false
#endif

# ---- blending: data buffers are never blended ---------------------------------------------------------
blend.gbuffers_terrain=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities_glowing.colortex1=off
blend.gbuffers_entities_glowing.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_water.colortex3=off
blend.gbuffers_water.colortex5=off
blend.gbuffers_hand_water.colortex3=off
blend.gbuffers_hand_water.colortex5=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off

alphaTest.gbuffers_water=off
alphaTest.gbuffers_hand_water=off

# ---- custom textures & uniforms -------------------------------------------------------------------
texture.noise=textures/noise.png

# 0..1, fades in when the player is in a snowy biome (used for the aurora)
uniform.float.snowiness=smooth(if(biome_precipitation == 2, 1.0, 0.0), 10, 10)

# ==================================================================================================
#   Settings menu
# ==================================================================================================
screen=<profile> <empty> [SHADOWS_SCREEN] [LIGHTING_SCREEN] [MATERIALS_SCREEN] [WATER_SCREEN] [SKY_SCREEN] [ATMOSPHERE_SCREEN] [POST_SCREEN]
screen.columns=2

screen.SHADOWS_SCREEN=SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS ENTITY_SHADOWS sunPathRotation shadowDistanceRenderMul
screen.LIGHTING_SCREEN=SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMP NIGHT_BRIGHTNESS MIN_LIGHT SSAO SSAO_STRENGTH VANILLA_AO HANDHELD_LIGHT SUBSURFACE_SCATTERING CLOUD_SHADOWS SPECULAR_HIGHLIGHTS
screen.MATERIALS_SCREEN=PBR_MODE EMISSIVE_ORES EMISSION_STRENGTH RAIN_PUDDLES PUDDLE_AMOUNT GENERATED_NORMALS NORMAL_STRENGTH
screen.WATER_SCREEN=WATER_STYLE REFLECTIONS WATER_WAVES SSR_QUALITY WAVE_HEIGHT WAVE_SPEED WATER_REFRACTION REFRACTION_STRENGTH WATER_CAUSTICS WATER_FOG_DENSITY
screen.SKY_SCREEN=VOLUMETRIC_CLOUDS CLOUD_QUALITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_SPEED STARS STAR_AMOUNT AURORA RAINBOWS SUN_SIZE MOON_SIZE
screen.ATMOSPHERE_SCREEN=VOLUMETRIC_LIGHT VL_QUALITY VL_STRENGTH FOG_DENSITY MORNING_FOG BORDER_FOG NETHER_FOG END_FOG WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH WAVING_SPEED
screen.POST_SCREEN=TAA SHARPENING BLOOM BLOOM_STRENGTH AUTO_EXPOSURE EXPOSURE TONEMAP VIGNETTE SATURATION VIBRANCE CONTRAST UNDERWATER_DISTORTION DEPTH_OF_FIELD DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH

sliders=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY NIGHT_BRIGHTNESS MIN_LIGHT SSAO_STRENGTH VANILLA_AO EMISSION_STRENGTH PUDDLE_AMOUNT NORMAL_STRENGTH WAVE_HEIGHT WAVE_SPEED REFRACTION_STRENGTH WATER_FOG_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_SPEED STAR_AMOUNT SUN_SIZE MOON_SIZE VL_STRENGTH FOG_DENSITY NETHER_FOG END_FOG WAVING_STRENGTH WAVING_SPEED SHARPENING BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE DOF_STRENGTH MOTION_BLUR_STRENGTH

# ---- quality profiles -------------------------------------------------------------------------------
profile.POTATO=!SHADOWS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_FILTER=0 !ENTITY_SHADOWS !SSAO !VOLUMETRIC_LIGHT VL_QUALITY=0 !VOLUMETRIC_CLOUDS CLOUD_QUALITY=0 REFLECTIONS=0 SSR_QUALITY=0
profile.LOW=SHADOWS shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=1 !ENTITY_SHADOWS !SSAO !VOLUMETRIC_LIGHT VL_QUALITY=0 VOLUMETRIC_CLOUDS CLOUD_QUALITY=0 REFLECTIONS=1 SSR_QUALITY=0
profile.MEDIUM=SHADOWS shadowMapResolution=1536 shadowDistance=96.0 SHADOW_FILTER=1 ENTITY_SHADOWS SSAO VOLUMETRIC_LIGHT VL_QUALITY=0 VOLUMETRIC_CLOUDS CLOUD_QUALITY=1 REFLECTIONS=2 SSR_QUALITY=0
profile.HIGH=SHADOWS shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=2 ENTITY_SHADOWS SSAO VOLUMETRIC_LIGHT VL_QUALITY=1 VOLUMETRIC_CLOUDS CLOUD_QUALITY=1 REFLECTIONS=2 SSR_QUALITY=1
profile.ULTRA=SHADOWS shadowMapResolution=4096 shadowDistance=192.0 SHADOW_FILTER=3 ENTITY_SHADOWS SSAO VOLUMETRIC_LIGHT VL_QUALITY=2 VOLUMETRIC_CLOUDS CLOUD_QUALITY=2 REFLECTIONS=2 SSR_QUALITY=2
