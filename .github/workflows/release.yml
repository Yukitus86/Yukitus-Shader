name: Release

# Builds the shader pack zip and publishes it as a GitHub Release, either
#  - when a tag like v1.0.1 is pushed, or
#  - when started manually (Actions -> Release -> Run workflow) with a tag name: the tag is then
#    created at the commit the workflow runs on, if it does not exist yet.
# The tag must match VERSION in tools/build.py. Release notes are read from .github/release-notes/<tag>.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.1 (created at the selected branch if it does not exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate options, menus, profiles and lang files
        run: python3 tools/validate.py

      - name: Build shader pack zip
        run: python3 tools/build.py

      - name: Check that the tag matches the build version
        run: |
          version=$(python3 -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('tools/build.py').read()).group(1))")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match VERSION v$version in tools/build.py"
            exit 1
          fi

      - name: Check that an existing tag points at this commit
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '{print $1}' | tail -n 1)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG already exists at $existing, but this run builds $GITHUB_SHA"
            exit 1
          fi

      - name: Publish release
        run: |
          zip="dist/Yukitus-Shader-${TAG}.zip"
          notes=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "$zip" --target "$GITHUB_SHA" --title "Yukitus Shader $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "$zip" --target "$GITHUB_SHA" --title "Yukitus Shader $TAG" --generate-notes
          fi
